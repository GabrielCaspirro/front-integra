<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard do Estudante - INTEGRA</title>
    <link rel="icon" href="/img/favicon.png" type="image/png" sizes="32x32" />
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/estudante.css">
    <!-- arquivo CSS que você me passou / ajustado -->
    <link rel="stylesheet" href="/css/agendados.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .event-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .tipo {
            background-color: #f4f4f4;
            border-radius: 8px;
            padding: 10px;
            display: block;
            font-weight: bold;
            color: var(--primary-color);
            text-align: center;
        }

        .event-nome {
            padding: 10px;
        }
    </style>
</head>

<body>
    <div class="flex-col min-h-screen">
        <!-- Header -->
        <header class="sticky-header">
            <div class="container">
                <div class="header-content">
                    <div class="logo">
                        <a href="/empresa" class="logo-link">
                            <img src="img/logo.png" alt="Logo INTEGRA" class="logo-image">
                        </a>
                    </div>

                    <button class="hamburger" id="hamburger">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>

                    <nav class="main-nav" id="mainNav">
                        <a href="/empresa" class="nav-link">Home</a>
                        <a href="/vagas" class="nav-link">Meus Eventos</a>
                        <a href="/agendados" class="nav-link active">Agendados</a>
                        <a href="/palestrantes-empresa" class="nav-link">Meus Palestrantes</a>

                        <div class="user-info" id="user-profile-btn">
                            <div class="user-avatar">
                                <i class="fas fa-user"></i>
                            </div>
                            <p id="empresaNome"></p>
                            <i class="fas fa-chevron-down"></i>
                        </div>

                        <div class="mobile-buttons">
                            <a href="/login" class="button primary-button">Sair</a>
                        </div>
                    </nav>
                </div>
            </div>
        </header>

        <!-- Main -->
        <main class="dashboard-main">
            <div class="section">
                <div class="container">
                    <!-- Welcome -->
                    <div class="welcome-section">
                        <h1 class="welcome-title">Veja seus Eventos</h1>
                        <p class="welcome-description">Acompanhe suas próximas Palestras e Visitas Técnicas</p>
                    </div>

                    <div class="calendar-card">
                        <div class="card-content">
                            <div class="calendar-container">
                                <div class="calendar" id="calendar">
                                    <!-- Calendário será gerado via JS -->
                                </div>

                                <div class="selected-day-events">
                                    <h3 class="selected-date" id="selected-date">Selecione uma data</h3>

                                    <div id="events-container" class="events-container">
                                        <!-- Template escondido: JS clona e preenche -->
                                    </div>

                                    <!-- Template do card (não exibido) -->
                                    <template id="event-template">
                                        <div class="event-item">
                                            <div class="event-header">
                                                <h4 class="event-nome"></h4>
                                                <span class="tipo"></span>
                                            </div>

                                            <div class="event-description">
                                                <span class="event-description-text"></span>
                                            </div>

                                            <div class="event-local">
                                                <i class="fas fa-map-marker-alt"
                                                    style="color: var(--primary-color); margin-right: 5px; margin-bottom:3px;"></i><strong>
                                                    Local:</strong> <span class="event-local-text"></span>
                                            </div>
                                            <div class="pula-linha"></div>
                                            <div class="event-data">
                                                <i class="fas fa-calendar"
                                                    style="color: var(--primary-color); margin-right: 5px; margin-bottom:3px;"></i><strong>
                                                    Data:</strong> <span class="event-date-text"></span>
                                            </div>
                                        </div>
                                    </template>

                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </main>

        <!-- Rating modal (simples) -->
        <div id="rating-modal"
            style="display:none; position:fixed; inset:0; align-items:center; justify-content:center; background:rgba(0,0,0,0.45); z-index:1200;">
            <div style="background:#fff; padding:1.25rem; border-radius:8px; width:min(520px,96%); position:relative;">
                <button id="close-modal"
                    style="position:absolute; right:12px; top:12px; background:none; border:none; font-size:1.25rem;">&times;</button>
                <h3 id="event-title" class="event-title"></h3>
                <p id="event-description" class="event-description" style="margin-top:0.25rem;"></p>

                <div class="rating-stars" style="margin-top:1rem;">
                    <button type="button" class="star-button" data-rating="1"><i class="far fa-star"></i></button>
                    <button type="button" class="star-button" data-rating="2"><i class="far fa-star"></i></button>
                    <button type="button" class="star-button" data-rating="3"><i class="far fa-star"></i></button>
                    <button type="button" class="star-button" data-rating="4"><i class="far fa-star"></i></button>
                    <button type="button" class="star-button" data-rating="5"><i class="far fa-star"></i></button>
                </div>

                <div style="text-align:right; margin-top:1rem;">
                    <button id="submit-rating" class="btn-avaliar" disabled>Enviar Avaliação</button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="dashboard-footer">
            <div class="container">
                <div class="footer-content">
                    <p class="copyright">© 2025 INTEGRA. Todos os direitos reservados.</p>
                    <div class="footer-links">
                        <a href="/termos-de-uso" class="footer-link">Termos de Uso</a>
                        <a href="/termos-de-privacidade" class="footer-link">Política de Privacidade</a>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script type="module" src="js/agendados.js"></script>
</body>

</html>
