<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Inscrições - INTEGRA</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/palestrante.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="/img/favicon.png" type="image/png">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="container">
                <div class="header-content">
                    <div class="logo">
                        <a href="/" class="logo-link">
                            <img src="../img/logo.png" alt="INTEGRA" class="logo-img">
                        </a>
                    </div>
                    <div class="user-menu">
                        <div class="user-info">
                            <div class="avatar">
                                <i class="fas fa-user"></i>
                            </div>
                            <span class="user-name">Ana Silva</span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container">
                <!-- Page Header -->
                <div class="page-header">
                    <div class="back-nav">
                        <a href="/palestrante" class="back-link">
                            <i class="fas fa-arrow-left"></i>
                            Voltar ao Palestrante
                        </a>
                    </div>
                    <h1 class="page-title">Minhas Inscrições</h1>
                    <p class="page-subtitle">Acompanhe o status das suas participações</p>
                </div>

                <!-- Tabs -->
                <div class="tabs-container">
                    <div class="tabs">
                        <button class="tab-btn active" data-tab="confirmadas">Confirmadas</button>
                        <button class="tab-btn" data-tab="pendentes">Pendentes</button>
                        <button class="tab-btn" data-tab="historico">Histórico</button>
                    </div>
                </div>

                <!-- Content -->
                <div class="tab-content active" id="confirmadas">
                    <div class="inscricoes-list" id="inscricoesConfirmadas">
                        <!-- Inscrições confirmadas serão carregadas via JS -->
                    </div>
                </div>

                <div class="tab-content" id="pendentes">
                    <div class="inscricoes-list" id="inscricoesPendentes">
                        <!-- Inscrições pendentes serão carregadas via JS -->
                    </div>
                </div>

                <div class="tab-content" id="historico">
                    <div class="inscricoes-list" id="inscricoesHistorico">
                        <!-- Histórico será carregado via JS -->
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="container">
                <div class="footer-content">
                    <p class="copyright">© 2025 INTEGRA. Todos os direitos reservados.</p>
                    <div class="footer-links">
                        <a href="#" class="footer-link">Termos</a>
                        <a href="#" class="footer-link">Privacidade</a>
                        <a href="#" class="footer-link">Suporte</a>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script src="/js/palestrante.js"></script>
</body>
</html>
