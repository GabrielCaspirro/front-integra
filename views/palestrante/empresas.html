<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empresas - INTEGRA</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/palestrante.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="/img/favicon.png" type="image/png">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="container">
                <div class="header-content">
                    <div class="logo">
                        <a href="/" class="logo-link">
                            <img src="../img/logo.png" alt="INTEGRA" class="logo-img">
                        </a>
                    </div>
                    <div class="user-menu">
                        <div class="user-info">
                            <div class="avatar">
                                <i class="fas fa-user"></i>
                            </div>
                            <span class="user-name">Ana Silva</span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container">
                <!-- Page Header -->
                <div class="page-header">
                    <div class="back-nav">
                        <a href="/palestrante" class="back-link">
                            <i class="fas fa-arrow-left"></i>
                            Voltar ao Palestrante
                        </a>
                    </div>
                    <h1 class="page-title">Empresas Parceiras</h1>
                    <p class="page-subtitle">Conecte-se com empresas que buscam palestrantes</p>
                </div>

                <!-- Search Bar -->
                <div class="search-section">
                    <div class="search-container">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" class="search-input" id="searchEmpresas" placeholder="Buscar empresas por nome ou setor...">
                    </div>
                </div>

                <!-- Empresas Grid -->
                <div class="content-grid" id="empresasGrid">
                    <!-- Empresas serão carregadas via JavaScript -->
                </div>
            </div>
        </main>

        <!-- Modal de Candidatura -->
        <div class="modal" id="candidaturaModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title">Candidatar-se como Palestrante</h3>
                    <button class="modal-close" id="closeCandidaturaModal">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="empresa-info" id="modalEmpresaInfo">
                        <!-- Informações da empresa serão preenchidas via JS -->
                    </div>
                    <div class="form-group">
                        <label for="cartaMotivacao">Carta de Motivação *</label>
                        <textarea id="cartaMotivacao" placeholder="Descreva por que você gostaria de fazer parte desta empresa..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="experiencia">Experiência Relevante *</label>
                        <textarea id="experiencia" placeholder="Descreva sua experiência relevante para esta empresa..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="disponibilidade">Disponibilidade *</label>
                        <input type="text" id="disponibilidade" placeholder="Ex: Segundas e Quartas, 14h às 17h" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" id="cancelCandidatura">Cancelar</button>
                    <button class="btn btn-primary" id="confirmCandidatura">Enviar Candidatura</button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <div class="container">
                <div class="footer-content">
                    <p class="copyright">© 2025 INTEGRA. Todos os direitos reservados.</p>
                    <div class="footer-links">
                        <a href="#" class="footer-link">Termos</a>
                        <a href="#" class="footer-link">Privacidade</a>
                        <a href="#" class="footer-link">Suporte</a>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script src="../js/palestrante.js"></script>
</body>
</html>
