<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escolha de Instituição</title>
  <link rel="icon" href="img/favicon.png" type="image/png" sizes="32x32" />
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/coordenador.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="etec-selector-container">
        <!-- Header -->
        <header class="sticky-header">
            <div class="container">
                <div class="header-content">
                    <div class="logo">
                        <a href="/coordenador" class="logo-link">
                            <img src="/img/logo.png" alt="Logo INTEGRA" class="logo-image">
                        </a>
                    </div>

                    <!-- Botão de menu hamburguer -->
                    <button class="hamburger" id="hamburger">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>

                    <!-- Menu de navegação principal -->
                    <nav class="main-nav" id="mainNav">
                        <!-- User Profile -->
                        <div class="user-info" id="user-profile-btn">
                            <div class="user-avatar">
                                <i class="fas fa-user"></i>
                            </div>
                            <p>Prof. João</p>
                            <i class="fas fa-chevron-down"></i>
                        </div>

                        <div class="mobile-buttons">
                            <a href="/login" class="button primary-button">Sair</a>
                        </div>
                    </nav>
                </div>
            </div>
        </header>

        <main class="dashboard-main">
            <div class="section primeiro">
                <div class="welcome-section">
                    <h1 class="welcome-title">Bem-vindo(a), Prof. João Silva!</h1>
                    <p class="welcome-description">Gerencie suas atividades acadêmicas e eventos da ETEC</p>
                </div>
            </div>

            <div class="etec-cards-grid" id="etec-cards">
                <!-- Modelo de card (fica escondido, usado como base) -->
                <div class="etec-card" id="etec-template" style="display:none;">
                    <div class="etec-icon">
                        <i class="fas fa-graduation-cap"></i>
                    </div>
                    <h3 class="etec-name"></h3>
                    <p class="etec-code"></p>
                    <div class="etec-stats">
                        <div class="stat-item">
                            <div class="stat-number stat-students"></div>
                            <div class="stat-label">Alunos</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number stat-events"></div>
                            <div class="stat-label">Eventos</div>
                        </div>
                    </div>
                    <button class="enter-button button primary-button">
                        <i class="fas fa-arrow-right"></i>
                        Entrar
                    </button>
                </div>
            </div>

        </main>
    </div>

    <!-- Footer -->
    <footer class="dashboard-footer">
        <div class="container">
            <div class="footer-content">
                <p class="copyright">© 2025 INTEGRA. Todos os direitos reservados.</p>
                <div class="footer-links">
                    <a href="/termos-de-uso" class="footer-link">Termos de Uso</a>
                    <a href="/termos-de-privacidade" class="footer-link">Política de Privacidade</a>
                </div>
            </div>
        </div>
    </footer>

    <script type="module" src="js/coordenador-instituicoes.js"></script>
</body>
</html>
